<title>編成ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700&display=swap">
<style>
:root{
  --bg:#f3f4f6;--panel:#ffffff;--panel2:#eceef2;--line:#d9dce3;--fg:#1b2030;--mute:#5d6578;--faint:#8d95a8;
  --accent:#27386b;--accent-fg:#ffffff;--accent-soft:#e3e8f6;--warn:#b3342b;--warn-soft:#f8e4e1;--ok:#2d6a4f;
  --rS:#a3562a;--rA:#6a4c93;--rB:#2d6a8f;--rC:#6b7488;
  --f魏:#2f5fa8;--f蜀:#2e7d5b;--f呉:#b8433a;--f群:#7a7f8c;--f漢:#a8841f;
  --shadow:0 10px 40px rgba(20,28,50,.18);--ff-h:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--ff-b:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151b;--panel:#1a1e27;--panel2:#222733;--line:#2e3442;--fg:#e6e9f0;--mute:#a0a8ba;--faint:#7a8296;
  --accent:#9db2ec;--accent-fg:#12151b;--accent-soft:#25304f;--warn:#ef8d84;--warn-soft:#3b2220;--ok:#7fcba3;
  --rS:#e39a6a;--rA:#b99be0;--rB:#78b4d9;--rC:#8d95a8;
  --f魏:#7aa3e0;--f蜀:#6fc19a;--f呉:#e48a82;--f群:#a1a6b3;--f漢:#d9b95a;--shadow:0 10px 40px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b;--panel:#1a1e27;--panel2:#222733;--line:#2e3442;--fg:#e6e9f0;--mute:#a0a8ba;--faint:#7a8296;
  --accent:#9db2ec;--accent-fg:#12151b;--accent-soft:#25304f;--warn:#ef8d84;--warn-soft:#3b2220;--ok:#7fcba3;
  --rS:#e39a6a;--rA:#b99be0;--rB:#78b4d9;--rC:#8d95a8;
  --f魏:#7aa3e0;--f蜀:#6fc19a;--f呉:#e48a82;--f群:#a1a6b3;--f漢:#d9b95a;--shadow:0 10px 40px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.6 var(--ff-b);padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2{font-family:var(--ff-h);margin:0;font-weight:700;letter-spacing:.04em;text-wrap:balance}
header{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
h1{font-size:28px;line-height:1.2}
.sub{color:var(--mute);font-size:12px;margin-top:4px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lim{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--mute)}
.lim input{width:56px;border:0;background:var(--panel2);border-radius:5px;padding:3px 6px;text-align:center;font-weight:700;color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{color:var(--accent-fg);opacity:.9}
.btn.danger.arm{background:var(--warn);color:#fff;border-color:var(--warn)}
.gsel.has,.skb[draggable=true]{cursor:grab}
.dragging{opacity:.4}
.gsel.has,.skb[data-dk]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.lifted{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 6px 18px rgba(20,28,50,.25);opacity:.85}
.movebar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:12px;background:var(--accent);color:var(--accent-fg);padding:8px 8px 8px 16px;border-radius:999px;box-shadow:var(--shadow);font-size:13px;max-width:calc(100% - 24px);white-space:nowrap}
.movebar span{overflow:hidden;text-overflow:ellipsis}
.movebar button{background:var(--accent-fg);color:var(--accent);border-radius:999px;padding:3px 12px;font-size:12px;flex:none}
.moving .gsel:not(.has),.moving .skb.empty{border-style:dashed}
.dz{outline:2px solid var(--accent);outline-offset:2px;background:var(--accent-soft)!important}
.dzbad{outline:2px dashed var(--warn);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:12px;z-index:40;max-width:calc(100% - 32px)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h2{font-size:13px;color:var(--mute);margin-bottom:10px;font-family:var(--ff-b);font-weight:500;letter-spacing:.08em}
.big{font-family:var(--ff-h);font-size:26px;line-height:1}
.big small{font-size:12px;color:var(--mute);font-family:var(--ff-b)}
.seg{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--panel2);margin:10px 0 8px}
.seg i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute)}
.legend b{color:var(--fg);font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats span{display:block;font-size:11px;color:var(--mute)}
.stats b{font-family:var(--ff-h);font-size:18px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.team{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;scroll-margin-top:12px}
.team.flash{animation:fl 1.4s ease}
@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.th{display:flex;align-items:center;justify-content:space-between;gap:8px}
.th h2{font-size:18px}
.th .no{font-size:11px;color:var(--faint);margin-left:6px;font-family:var(--ff-b);letter-spacing:.1em}
.meter{height:6px;border-radius:3px;background:var(--panel2);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px;transition:width .2s}
.meter.over i{background:var(--warn)}
.mrow{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:4px}
.mrow b{color:var(--fg)}.over .mrow b,.mrow b.over{color:var(--warn)}
.slot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.role{font-size:10px;letter-spacing:.14em;color:var(--faint)}
.gsel{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--mute);background:var(--panel2)}
.gsel:hover{border-color:var(--accent);color:var(--accent)}
.gsel.has{border-style:solid;background:var(--panel);color:var(--fg)}
.gname{font-family:var(--ff-h);font-size:18px;font-weight:700;line-height:1.2}
.gmeta{font-size:11px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:6px;color:#fff;font-size:12px;font-weight:700;padding:0 4px;flex:none}
:root[data-theme="dark"] .fb,.fb{color:#fff}
.cost{margin-left:auto;font-family:var(--ff-h);font-size:20px;flex:none}
.apt{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.apt button{border:1px solid var(--line);border-radius:8px;padding:3px 0;text-align:center;font-size:11px;color:var(--mute);background:var(--panel)}
.apt button b{display:block;font-size:14px;line-height:1.2}
.apt button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.apt button .rr{display:flex;justify-content:center;gap:3px;font-size:11px;font-weight:700;line-height:1.3;min-height:14px}
.ttl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mute);margin-bottom:4px}
.aptb{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:18px;color:var(--mute)}
.aptb b{font-weight:700}
.rolerow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fold{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 8px;line-height:18px}
.fold:hover{border-color:var(--accent);color:var(--accent)}
.brief{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;border-radius:8px;padding:6px 10px;background:var(--panel2);font-size:12px;color:var(--fg)}
.brief:hover{outline:1px solid var(--accent)}
.brief .bl{display:flex;gap:8px;min-width:0}
.brief .bl>span:first-child{flex:none;font-size:10px;color:var(--faint);letter-spacing:.1em;line-height:19px;width:3.6em;white-space:nowrap}
.brief .bl>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brief .nil{color:var(--faint)}
.thb{display:flex;gap:6px}
.R-S{color:var(--rS)}.R-A{color:var(--rA)}.R-B{color:var(--rB)}.R-C{color:var(--rC)}
.sk{display:flex;flex-direction:column;gap:4px}
.skb{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;text-align:left;width:100%;min-height:32px;background:var(--panel)}
.skb.own{background:var(--panel2);cursor:default}
.skb.empty{border-style:dashed;color:var(--faint);font-size:12px}
.skb.empty:hover{border-color:var(--accent);color:var(--accent)}
.tag{font-size:10px;border-radius:4px;padding:0 5px;background:var(--panel2);color:var(--mute);flex:none;line-height:18px}
.rk{font-size:11px;font-weight:700;flex:none}
.x{margin-left:auto;color:var(--faint);padding:0 4px;font-size:16px;line-height:1}.x:hover{color:var(--warn)}
.tomes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tomes select{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 6px;font-size:12px;min-width:0;text-overflow:ellipsis}
.tomes select:disabled{opacity:.45}
.lab{font-size:10px;color:var(--faint);letter-spacing:.1em;margin-bottom:-2px}
.tstat{display:flex;gap:12px;font-size:11px;color:var(--mute);flex-wrap:wrap}
.tstat b{color:var(--fg)}
.addrow{display:flex;justify-content:center}
.sheets{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--mute);white-space:nowrap}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.tab small{opacity:.75;margin-left:6px;font-weight:400}
.tabadd{flex:none;border:1px dashed var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mute)}
.tabadd:hover{border-color:var(--accent);color:var(--accent)}
.sheetbar{display:flex;flex-direction:column;gap:6px}
.sheetops{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sheetops input{border:1px solid var(--accent);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:13px;width:min(240px,100%)}
.io textarea{width:100%;min-height:120px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px;font:12px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
.io .ctl{margin-top:8px}.msg{font-size:12px;color:var(--mute)}
/* picker */
.back{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:20}
.pick{position:fixed;z-index:21;top:0;bottom:0;right:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ph{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.ph .row{display:flex;justify-content:space-between;align-items:center}
.ph h2{font-size:17px}
.ph input[type=search]{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--mute)}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.plist{overflow:auto;flex:1;padding:6px 8px 20px;overscroll-behavior:contain}
.it{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:8px;border-radius:8px;border-bottom:1px solid var(--line)}
.it:hover{background:var(--accent-soft)}
.it.used{opacity:.5;background:var(--panel2)}
.it .main{min-width:0;flex:1}
.it .nm{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it .ds{font-size:11px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{font-size:10px;background:var(--fg);color:var(--bg);border-radius:4px;padding:0 6px;line-height:18px;font-weight:500;flex:none}
.badge.w{background:var(--warn);color:#fff}
.none{padding:24px;text-align:center;color:var(--faint)}
.cuf{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px;align-items:center}
.cuf input,.cuf select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 8px;font-size:13px;min-width:0}
.cuf .lab{grid-column:1/-1;margin:0}
.cuwrap{display:flex;align-items:stretch}.cuwrap .it{flex:1}
.cudel{flex:none;color:var(--faint);padding:0 12px;font-size:12px;border-bottom:1px solid var(--line)}.cudel:hover{color:var(--warn)}
.tag.cu{background:var(--accent-soft);color:var(--accent)}
@media(max-width:640px){
  h1{font-size:23px}
  .pick{top:auto;left:0;right:0;width:auto;height:84vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0}
}
</style>

<script>
(function(){
const D=JSON.parse(document.getElementById('D').textContent);D.generals=D.generals.filter(g=>g.s>=4);
const G={},SK=D.skills,TO=D.tomes,CATS=Object.keys(TO);
D.generals.forEach(g=>G[g.n]=g);
const TP=['騎','盾','弓','槍','器'],MAXT=10,KEY='shinsen-composer-v1',KEY2='shinsen-composer-v2',MAXSH=20;
const FC=f=>'var(--f'+f+')';
const ROLE=['主将','副将','副将'];
const mkSlot=()=>({g:null,sk:[null,null],tm:['','','',''],cl:false});
const mkTeam=()=>({tp:'',slots:[mkSlot(),mkSlot(),mkSlot()]});
let S={limit:20,teams:[mkTeam()]};
// プリセット（編成案）：シートごとに独立した編成。武将・戦法の重複不可はシート内だけで判定する
let B={cur:0,sheets:[{n:'編成案1',s:S}],cu:{}},ren=-1;
const nextName=()=>{let i=B.sheets.length+1;while(B.sheets.some(x=>x.n==='編成案'+i))i++;return '編成案'+i};
let P=null,arm=null,ioMsg='',ioText='';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bestTp=g=>{const r='SABC';let b=0,bi=0;[...g.a].forEach((x,i)=>{const v=3-r.indexOf(x);if(v>b){b=v;bi=i}});return TP[bi]};
const aptOf=(g,t)=>g.a[TP.indexOf(t)];
const tomeCount=g=>g.s>=5?4:3;
const s3opts=(cat,exceptWhat)=>TO[cat]?TO[cat].s3.filter(x=>!exceptWhat.includes(x)):[];
// カスタム戦法：ツールに無い戦法（シーズン限定など）を名前だけで登録する。全編成案で共通、全兵種で使える
const CUT=['アクティブ','パッシブ','指揮','突撃','兵種','陣法'];
function cuDef(x){
  const n=String(x&&x.n||'').trim().slice(0,20);if(!n)return null;
  if(SK[n]&&!SK[n].cu)return null; // 既存の戦法と同名なら登録しない（既存を使う）
  return {n,r:['S','A','B','C'].includes(x.r)?x.r:'',t:CUT.includes(x.t)?x.t:'アクティブ',tr:TP.join(''),tg:'',p:'',src:'',x:'カスタム戦法（編成ノートで追加）',in:1,cu:1};
}
function cuAdd(x){const d=cuDef(x);if(d){SK[d.n]=d;B.cu[d.n]={n:d.n,r:d.r,t:d.t}}return d}
const cuList=()=>Object.keys(B.cu||{});
function sanitize(raw){
  const out={limit:20,teams:[]};
  if(!raw||typeof raw!=='object')return null;
  const lim=parseInt(raw.limit,10);if(lim>=1&&lim<=200)out.limit=lim;
  if(raw.cu&&typeof raw.cu==='object')Object.values(raw.cu).forEach(cuAdd); // 書き出しJSONに含まれるカスタム戦法
  const ug=new Set(),us=new Set();
  const tl=Array.isArray(raw.teams)?raw.teams.slice(0,MAXT):[];
  // pass 1: own skills reserved
  tl.forEach(t=>(t&&t.slots||[]).forEach(s=>{const g=s&&G[s.g];if(g&&!ug.has(g.n)){/*reserve later*/}}));
  tl.forEach(t=>{
    const nt=mkTeam(),rs=((t&&t.slots)||[]).slice(0,3);
    // 部隊の兵種：部隊のtp → 旧形式の武将ごとのtp（主将優先）→ 主将の最適兵種
    nt.tp=TP.includes(t&&t.tp)?t.tp:((rs.find(s=>s&&TP.includes(s.tp))||{}).tp||'');
    if(!nt.tp){const f=rs.find(s=>s&&G[s.g]);if(f)nt.tp=bestTp(G[f.g])}
    ((t&&t.slots)||[]).slice(0,3).forEach((s,i)=>{
      const ns=nt.slots[i];if(!s)return;
      const g=G[s.g];if(!g||ug.has(g.n))return;
      if(g.o.some(o=>us.has(o)))return;
      ug.add(g.n);g.o.forEach(o=>us.add(o));ns.g=g.n;ns.cl=!!s.cl;
      (Array.isArray(s.sk)?s.sk:[]).slice(0,2).forEach((k,j)=>{
        const sk=SK[k];if(sk&&sk.in&&sk.tr.includes(nt.tp)&&!us.has(k)&&!g.o.includes(k)){us.add(k);ns.sk[j]=k}});
      const tm=Array.isArray(s.tm)?s.tm:[];
      if(TO[tm[0]]){ns.tm[0]=tm[0];
        if(TO[tm[0]].s2.includes(tm[1]))ns.tm[1]=tm[1];
        if(TO[tm[0]].s3.includes(tm[2]))ns.tm[2]=tm[2];
        if(g.s>=5&&TO[tm[0]].s3.includes(tm[3])&&tm[3]!==ns.tm[2])ns.tm[3]=tm[3];}
    });
    out.teams.push(nt);
  });
  if(!out.teams.length)out.teams.push(mkTeam());
  return out;
}
function save(){B.sheets[B.cur].s=S;try{localStorage.setItem(KEY2,JSON.stringify(B))}catch(e){}}

    if(sh.length){B={cur:Math.min(Math.max(0,raw.cur|0),sh.length-1),sheets:sh,cu:B.cu};S=B.sheets[B.cur].s;return}}
  const r=localStorage.getItem(KEY); // 旧形式（シート1枚）を編成案1として引き継ぐ
  if(r){const s=sanitize(JSON.parse(r));if(s){S=s;B={cur:0,sheets:[{n:'編成案1',s}],cu:B.cu}}}

    ${B.sheets.length<MAXSH?`<button class="tabadd" data-act="sheetadd" title="新しい編成案">＋ 新規</button>`:''}</div><div class="sheetops">`;

function used(){
  const ug={},us={};
  S.teams.forEach((t,ti)=>t.slots.forEach((s,si)=>{
    if(!s.g)return;const g=G[s.g];ug[g.n]={t:ti,s:si};
    g.o.forEach(o=>us[o]={t:ti,s:si,own:1});

let DR=null,toastT=null;
function toast(m){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el)}
  el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2600)}
const pr=v=>v.split(',').map(Number);
function clearDz(){document.querySelectorAll('.dz,.dzbad').forEach(e=>e.classList.remove('dz','dzbad'))}
function canSk(ti,slot,k){return !k||(slot.g&&SK[k].tr.includes(S.teams[ti].tp))}
function dropTargetOK(el,d){
  d=d||DR;if(!d)return false;
  if(d.kind==='g'){const t=el.closest('[data-slot]');if(!t)return false;const [t2,s2]=pr(t.dataset.slot),[t1,s1]=d.v;
    if(t1===t2)return true;const a=S.teams[t1].slots[s1],b=S.teams[t2].slots[s2];
    return !badSk(a,S.teams[t2].tp||S.teams[t1].tp).length&&!badSk(b,S.teams[t1].tp).length}
  const t=el.closest('[data-sk]');if(!t)return false;
  const [t2,s2,k2]=pr(t.dataset.sk),[t1,s1,k1]=d.v;
  const a=S.teams[t1].slots[s1],b=S.teams[t2].slots[s2];
  return canSk(t2,b,a.sk[k1])&&canSk(t1,a,b.sk[k2]&&!(t1===t2&&s1===s2)?b.sk[k2]:null);
}
const dropTarget=(el,d)=>el.closest(d.kind==='g'?'[data-slot]':'[data-sk]');
// d={kind:'g'|'k',v:[...]} を target 要素へ移動。ドラッグとタッチ移動で共通
function doMove(d,t){
  if(d.kind==='g'){
    const [t2,s2]=pr(t.dataset.slot),[t1,s1]=d.v;
    if(t1===t2&&s1===s2){render();return}
    const A=S.teams[t1],B=S.teams[t2],a=A.slots[s1],b=B.slots[s2];
    if(!B.tp)B.tp=A.tp; // 兵種未選択（武将なし）の部隊へは移動元の兵種ごと移す
    if(t1!==t2){const ba=badSk(a,B.tp),bb=badSk(b,A.tp);
      if(ba.length){toast(`${ba.join('・')} は${B.tp}兵の部隊${t2+1}では使えません`);render();return}
      if(bb.length){toast(`${bb.join('・')} は${A.tp}兵の部隊${t1+1}では使えません`);render();return}}
    const ca=teamCost(A),cb=teamCost(B);
    A.slots[s1]=b;B.slots[s2]=a;
    if(t1!==t2){const na=teamCost(A),nb=teamCost(B);
      if((nb>S.limit&&nb>cb)||(na>S.limit&&na>ca)){A.slots[s1]=a;B.slots[s2]=b;toast('コスト上限を超えるため移動できません');render();return}}
    save();render();toast(b.g?`${a.g} と ${b.g} を入れ替えました`:`${a.g} を部隊${t2+1}へ移動しました`);return;
  }
  const [t2,s2,k2]=pr(t.dataset.sk),[t1,s1,k1]=d.v;
  if(t1===t2&&s1===s2&&k1===k2){render();return}
  const a=S.teams[t1].slots[s1],b=S.teams[t2].slots[s2];
  const ka=a.sk[k1],kb=b.sk[k2];
  if(!b.g){toast('武将のいない枠には置けません');render();return}
  const tpa=S.teams[t1].tp,tpb=S.teams[t2].tp;
  if(!SK[ka].tr.includes(tpb)){toast(`${ka} は${tpb}兵の部隊${t2+1}では使えません`);render();return}
  if(kb&&!SK[kb].tr.includes(tpa)){toast(`${kb} は${tpa}兵の部隊${t1+1}では使えません`);render();return}
  a.sk[k1]=kb||null;b.sk[k2]=ka;
  save();render();toast(kb?`${ka} と ${kb} を入れ替えました`:`${ka} を移動しました`);
}

  const el=k||g;if(!el){return}
  DR=k?{kind:'k',v:pr(k.dataset.dk)}:{kind:'g',v:pr(g.dataset.dg)};
  try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','x')}catch(x){}
  setTimeout(()=>el.classList.add('dragging'),0);
});
document.addEventListener('dragover',e=>{
  if(!DR)return;
  const tgt=DR.kind==='g'?e.target.closest('[data-slot]'):e.target.closest('[data-sk]');
  clearDz();
  if(!tgt)return;
  e.preventDefault();
  tgt.classList.add(dropTargetOK(e.target)?'dz':'dzbad');
});
document.addEventListener('dragend',()=>{DR=null;clearDz();document.querySelectorAll('.dragging').forEach(e=>e.classList.remove('dragging'))});
document.addEventListener('drop',e=>{
  if(!DR)return;e.preventDefault();
  const d=DR;DR=null;clearDz();
  const t=dropTarget(e.target,d);if(!t)return;
  doMove(d,t);
});

/* ---- タッチ移動：長押しで持ち上げ → 移動先をタップ ---- */
let MV=null,lp=null;
function startMove(el){
  MV=el.dataset.dk?{kind:'k',v:pr(el.dataset.dk)}:{kind:'g',v:pr(el.dataset.dg)};
  P=null;
  try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}
  render();
}
function cancelMove(){if(!MV)return;MV=null;render()}
function moveLabel(){
  if(!MV)return '';const [t,s,k]=MV.v,sl=S.teams[t].slots[s];
  return MV.kind==='g'?sl.g:sl.sk[k];
}
function markMove(){ // render 後に持ち上げ中の要素と移動先を色分け
  document.body.classList.toggle('moving',!!MV);
  const old=document.querySelector('.movebar');if(old)old.remove();
  if(!MV)return;
  const src=MV.kind==='g'?document.querySelector(`[data-dg="${MV.v.join(',')}"]`):document.querySelector(`[data-dk="${MV.v.join(',')}"]`);
  if(src)src.classList.add('lifted');
  document.querySelectorAll(MV.kind==='g'?'[data-slot]':'[data-sk]').forEach(el=>{
    if(el===src||(src&&el.contains(src))||(MV.kind==='k'&&el.dataset.sk===MV.v.join(',')))return;
    el.classList.add(dropTargetOK(el,MV)?'dz':'dzbad')});
  const bar=document.createElement('div');bar.className='movebar';
  bar.innerHTML=`<span>${esc(moveLabel())} の移動先をタップ</span><button data-mv="cancel">やめる</button>`;
  document.body.appendChild(bar);
}
document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'||MV)return;
  const el=e.target.closest('[data-dg],[data-dk]');if(!el||e.target.closest('.x'))return;
  const x=e.clientX,y=e.clientY;clearTimeout(lp&&lp.t);
  lp={x,y,t:setTimeout(()=>{lp=null;startMove(el)},450)};
});
document.addEventListener('pointermove',e=>{if(lp&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>10){clearTimeout(lp.t);lp=null}});
['pointerup','pointercancel','scroll'].forEach(ev=>document.addEventListener(ev,()=>{if(lp){clearTimeout(lp.t);lp=null}},true));
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-dg],[data-dk]')&&(MV||lp))e.preventDefault()});
// 移動モード中のタップは capture で先に処理し、通常のクリック動作（ピッカーを開く等）を止める
document.addEventListener('click',e=>{
  if(!MV)return;
  e.preventDefault();e.stopPropagation();
  if(e.target.closest('[data-mv="cancel"]'))return cancelMove();
  if(e.target.closest('.lifted'))return; // 持ち上げた本体へのタップ（長押し後に指を離した時のクリック含む）は無視して移動モードを続ける
  const d=MV,t=dropTarget(e.target,d);
  if(!t)return cancelMove();
  MV=null;doMove(d,t);
},true);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;
  const a=b.dataset.act,pk=(a==='setg'||a==='setsk'||a==='cuadd')&&P,t=pk?P.t:+b.dataset.t,s=pk?P.s:+b.dataset.s;
  const slot=()=>S.teams[t].slots[s];
  if(a!=='reset'&&a!=='delteam'&&a!=='sheetdel'&&a!=='cudel')arm=null;
  if(a!=='renok'&&a!=='renstart')ren=-1;
  switch(a){
    case 'none':return;
    case 'sheet':{const i=+b.dataset.i;if(i!==B.cur)switchSheet(i);break}
    case 'sheetadd':save();B.sheets.push({n:nextName(),s:{limit:S.limit,teams:[mkTeam()]}});switchSheet(B.sheets.length-1);break;
    case 'sheetdup':{if(B.sheets.length>=MAXSH)break;save();const c=sanitize(JSON.parse(JSON.stringify(S)));B.sheets.splice(B.cur+1,0,{n:(B.sheets[B.cur].n+'のコピー').slice(0,30),s:c});switchSheet(B.cur+1);break}
    case 'sheetdel':if(arm==='sh'){B.sheets.splice(B.cur,1);B.cur=Math.min(B.cur,B.sheets.length-1);S=B.sheets[B.cur].s;arm=null}else arm='sh';break;
    case 'renstart':ren=B.cur;render();{const r=document.getElementById('ren');if(r){r.focus();r.select()}}return;
    case 'renok':{const r=document.getElementById('ren');const v=r&&r.value.trim();if(v)B.sheets[B.cur].n=v.slice(0,30);ren=-1;break}
    case 'sample':S=sanitize(SAMPLE);ioMsg='サンプル（検証済みの曹操隊）を読み込みました';break;
    case 'reset':if(arm==='reset'){S={limit:S.limit,teams:[mkTeam()]};arm=null;ioMsg='リセットしました'}else arm='reset';break;
    case 'delteam':if(arm==='t'+t){S.teams.splice(t,1);if(!S.teams.length)S.teams.push(mkTeam());arm=null}else arm='t'+t;break;
    case 'addteam':if(S.teams.length<MAXT)S.teams.push(mkTeam());break;
    case 'pickg':P={kind:'gen',t,s,q:'',f:'全'};break;
    case 'picksk':P={kind:'sk',t,s,k:+b.dataset.k,q:'',f:'全'};break;
    case 'close':P=null;break;
    case 'filt':P.f=b.dataset.v;break;
    case 'jump':return jump(+b.dataset.t);
    case 'setg':{const g=G[b.dataset.n],sl=slot(),T=S.teams[t];if(sl.g!==g.n){sl.g=g.n;sl.sk=[null,null];sl.tm=['','','',''];sl.cl=false;}if(!T.tp)T.tp=bestTp(g);P=null;break}
    case 'setsk':slot().sk[P.k]=b.dataset.n;P=null;break;
    case 'cuadd':{const nm=(document.getElementById('cuN').value||'').trim().slice(0,20);
      if(!nm){toast('戦法名を入力してください');return}
      const U=used();if(U.us[nm]){toast(`${nm} は部隊${U.us[nm].t+1}で使用中です`);return}
      const ex=SK[nm];
      if(ex&&!ex.cu){if(!ex.in||!ex.tr.includes(S.teams[P.t].tp)){toast(`${nm} は一覧にありますが、ここには付けられません`);return}slot().sk[P.k]=nm;P=null;toast(`${nm} は一覧にある戦法なのでそのまま付けました`);break}
      const d=cuAdd({n:nm,t:document.getElementById('cuT').value,r:document.getElementById('cuR').value});
      slot().sk[P.k]=d.n;P=null;toast(`カスタム戦法「${d.n}」を追加しました`);break}
    case 'cudel':{const n=b.dataset.n;if(arm!=='cu:'+n){arm='cu:'+n;break}
      arm=null;delete B.cu[n];delete SK[n];B.sheets.forEach(x=>x.s.teams.forEach(t=>t.slots.forEach(s=>{s.sk=s.sk.map(k=>k===n?null:k)})));toast(`カスタム戦法「${n}」を削除しました`);break}
    case 'clrsk':slot().sk[+b.dataset.k]=null;break;
    case 'ttp':{const T=S.teams[t];if(T.tp===b.dataset.v)break;T.tp=b.dataset.v;const rm=cleanSkills(T);if(rm.length)toast(`${T.tp}兵に合わないため外しました：${rm.join('・')}`);break}
    case 'fold':slot().cl=!slot().cl;break;
    case 'foldteam':{const T=S.teams[t],o=T.slots.some(x=>x.g&&!x.cl);T.slots.forEach(x=>x.cl=o);break}
    case 'foldall':{const o=anyOpen();S.teams.forEach(T=>T.slots.forEach(x=>x.cl=o));break}
    case 'export':ioText=exportJson();ioMsg='書き出しました';break;
    case 'copy':{ioText=exportJson();render();const ta=document.getElementById('io');ta.select();
      (navigator.clipboard?navigator.clipboard.writeText(ioText):Promise.reject()).then(()=>{ioMsg='コピーしました';render()}).catch(()=>{ioMsg='選択しました。手動でコピーしてください';render();document.getElementById('io').select()});return}
    case 'import':{try{const s=sanitize(JSON.parse(document.getElementById('io').value));if(!s)throw 0;S=s;ioMsg='読み込みました（不正・重複は除外）'}catch(x){ioMsg='JSONを読み取れませんでした'}break}
  }
  save();render();
});
document.addEventListener('input',e=>{
  const a=e.target.dataset.act;
  if(a==='q'){if(e.isComposing)return;qUpdate(e.target.value)}
});
document.addEventListener('compositionend',e=>{if(e.target.dataset&&e.target.dataset.act==='q')qUpdate(e.target.value)});
function qUpdate(v){ // 検索欄は作り直さず、一覧だけ差し替える（IME変換を壊さない）
  if(!P)return;P.q=v;
  const t=document.createElement('div');t.innerHTML=pickerHtml(used());
  const nl=t.querySelector('.plist'),ol=document.querySelector('.plist');
  if(nl&&ol){ol.innerHTML=nl.innerHTML;ol.scrollTop=0}
}
document.addEventListener('change',e=>{
  const el=e.target,a=el.dataset.act;
  if(a==='limit'){const v=parseInt(el.value,10);if(v>=1&&v<=200)S.limit=v;save();render()}
  else if(a==='tome'){const sl=S.teams[+el.dataset.t].slots[+el.dataset.s],i=+el.dataset.i;
    if(i===0)sl.tm=[el.value,'','',''];else sl.tm[i]=el.value;
    if(sl.tm[2]&&sl.tm[2]===sl.tm[3]){sl.tm[i===2?3:2]=''}
    save();render()}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='cuN'&&e.key==='Enter'&&!e.isComposing){const bt=document.querySelector('[data-act=cuadd]');if(bt)bt.click();return}
  if(e.target.id==='ren'&&!e.isComposing){if(e.key==='Enter'){const v=e.target.value.trim();if(v)B.sheets[B.cur].n=v.slice(0,30);ren=-1;save();render();return}if(e.key==='Escape'){ren=-1;render();return}}
  if(e.key!=='Escape')return;if(MV)return cancelMove();if(P){P=null;render()}});
const SAMPLE={limit:20,teams:[{tp:'盾',slots:[
 {g:'曹操',sk:['非攻制勝','魚鱗陣'],tm:['軍形','臨戦態勢','守勢','静心']},
 {g:'夏侯惇',sk:['気凌三軍','文武両道'],tm:['軍形','反転攻勢','鉄兜','柔能制剛']},
 {g:'満寵',sk:['伏機即動','虎衛軍'],tm:['用間','時勢判断','持重','譲渡']}]}]};
load();render();
})();
</script>
